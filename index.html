<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header class="toolbar">
    <div class="group">
      <button id="btn-open" class="btn primary">📂 Abrir</button>
      <button id="btn-undo" class="btn" title="Deshacer rotación/recorte (Ctrl+Z)" disabled>↩ Deshacer</button>
      <button id="btn-rot-l" class="btn" title="Rotar 90° izquierda" data-needs-image disabled>↺</button>
      <button id="btn-rot-r" class="btn" title="Rotar 90° derecha" data-needs-image disabled>↻</button>
      <button id="btn-flip-h" class="btn" title="Voltear horizontal" data-needs-image disabled>⇄</button>
      <button id="btn-flip-v" class="btn" title="Voltear vertical" data-needs-image disabled>⇅</button>
      <button id="btn-crop" class="btn" data-needs-image disabled>✂️ Recortar</button>
      <button id="btn-reset" class="btn" data-needs-image disabled>Restaurar</button>
    </div>
    <div class="group">
      <select id="export-format" data-needs-image disabled>
        <option value="image/png">PNG</option>
        <option value="image/jpeg">JPG</option>
        <option value="image/webp">WebP</option>
      </select>
      <button id="btn-download" class="btn primary" data-needs-image disabled>💾 Descargar</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="sidebar">
      <h3>Ajustes</h3>
      <label>Brillo <span id="val-brightness">100%</span>
        <input type="range" id="range-brightness" min="0" max="200" value="100" data-needs-image disabled></label>
      <label>Contraste <span id="val-contrast">100%</span>
        <input type="range" id="range-contrast" min="0" max="200" value="100" data-needs-image disabled></label>
      <label>Saturación <span id="val-saturation">100%</span>
        <input type="range" id="range-saturation" min="0" max="200" value="100" data-needs-image disabled></label>
      <label>Desenfoque <span id="val-blur">0px</span>
        <input type="range" id="range-blur" min="0" max="20" value="0" data-needs-image disabled></label>

      <h3>Filtros</h3>
      <div class="chips">
        <button class="chip active" data-filter="none" data-needs-image disabled>Normal</button>
        <button class="chip" data-filter="grayscale" data-needs-image disabled>B&amp;N</button>
        <button class="chip" data-filter="sepia" data-needs-image disabled>Sepia</button>
        <button class="chip" data-filter="invert" data-needs-image disabled>Invertir</button>
      </div>

      <div id="crop-panel" class="hidden">
        <h3>Recorte</h3>
        <label>Proporción
          <select id="crop-ratio">
            <option value="0">Libre</option>
            <option value="1">1:1</option>
            <option value="1.3333">4:3</option>
            <option value="0.75">3:4</option>
            <option value="1.7778">16:9</option>
            <option value="0.5625">9:16</option>
          </select>
        </label>
        <p id="crop-size" class="muted"></p>
        <div class="group">
          <button id="btn-apply-crop" class="btn primary">✓ Aplicar</button>
          <button id="btn-cancel-crop" class="btn">✕ Cancelar</button>
        </div>
      </div>
    </aside>

    <section class="viewport" id="viewport">
      <div id="drop-hint" class="drop-hint">Arrastra una imagen aquí, pégala (Ctrl+V) o haz clic para abrirla</div>
      <div id="stage" class="stage hidden">
        <canvas id="main-canvas"></canvas>
        <canvas id="overlay-canvas"></canvas>
      </div>
    </section>
  </main>

  <footer class="status">
    <span id="img-info">Sin imagen</span>
    <span id="zoom-info"></span>
  </footer>
</div>

<input type="file" id="file-input" accept="image/*" hidden>
<script src="app.js"></script>
</body>
</html>
