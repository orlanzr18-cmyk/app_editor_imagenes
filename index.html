<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header class="toolbar">
    <div class="group">
      <button id="btn-open" class="btn primary">📂 Abrir</button>
      <button id="btn-undo" class="btn" title="Deshacer (Ctrl+Z)" disabled>↩ Deshacer</button>
      <button id="btn-rot-l" class="btn" title="Rotar 90° izquierda" data-needs-image disabled>↺</button>
      <button id="btn-rot-r" class="btn" title="Rotar 90° derecha" data-needs-image disabled>↻</button>
      <button id="btn-flip-h" class="btn" title="Voltear horizontal" data-needs-image disabled>⇄</button>
      <button id="btn-flip-v" class="btn" title="Voltear vertical" data-needs-image disabled>⇅</button>
      <button id="btn-crop" class="btn" data-needs-image disabled>✂️ Recortar</button>
      <button id="btn-reset" class="btn" data-needs-image disabled>Restaurar</button>
    </div>
    <div class="group">
      <select id="export-format" data-needs-image disabled>
        <option value="image/png">PNG</option>
        <option value="image/jpeg">JPG</option>
        <option value="image/webp">WebP</option>
      </select>
      <button id="btn-download" class="btn primary" data-needs-image disabled>💾 Descargar</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="sidebar">
      <h3>Ajustes</h3>
      <label>Brillo <span id="val-brightness">100%</span>
        <input type="range" id="range-brightness" min="0" max="200" value="100" data-needs-image disabled></label>
      <label>Contraste <span id="val-contrast">100%</span>
        <input type="range" id="range-contrast" min="0" max="200" value="100" data-needs-image disabled></label>
      <label>Saturación <span id="val-saturation">100%</span>
        <input type="range" id="range-saturation" min="0" max="200" value="100" data-needs-image disabled></label>
      <label>Desenfoque <span id="val-blur">0px</span>
        <input type="range" id="range-blur" min="0" max="20" value="0" data-needs-image disabled></label>

      <h3>Filtros</h3>
      <div class="chips">
        <button class="chip active" data-filter="none" data-needs-image disabled>Normal</button>
        <button class="chip" data-filter="grayscale" data-needs-image disabled>B&amp;N</button>
        <button class="chip" data-filter="sepia" data-needs-image disabled>Sepia</button>
        <button class="chip" data-filter="invert" data-needs-image disabled>Invertir</button>
      </div>

      <h3>Texto (OCR)</h3>
      <label>Idioma
        <select id="ocr-lang" data-needs-image disabled>
          <option value="spa">Español</option>
          <option value="eng">Inglés</option>
          <option value="spa+eng">Español + Inglés</option>
        </select>
      </label>
      <button id="btn-ocr" class="btn primary block" data-needs-image disabled>🔍 Reconocer texto</button>
      <div id="ocr-status" class="ocr-status hidden">
        <progress id="ocr-progress" max="1" value="0"></progress>
        <span id="ocr-msg"></span>
      </div>
      <button id="btn-show-text" class="btn block" data-needs-ocr disabled>📄 Ver / copiar texto</button>
      <button id="btn-show-table" class="btn block" data-needs-ocr disabled>📊 Tabla (Excel / CSV)</button>
      <button id="btn-text-mode" class="btn block" data-needs-ocr disabled>✏️ Editar texto en la imagen</button>
      <p id="text-hint" class="muted hidden">Haz clic en un texto resaltado para reemplazarlo o borrarlo.</p>

      <div id="crop-panel" class="hidden">
        <h3>Recorte</h3>
        <label>Proporción
          <select id="crop-ratio">
            <option value="0">Libre</option>
            <option value="1">1:1</option>
            <option value="1.3333">4:3</option>
            <option value="0.75">3:4</option>
            <option value="1.7778">16:9</option>
            <option value="0.5625">9:16</option>
          </select>
        </label>
        <p id="crop-size" class="muted"></p>
        <div class="group">
          <button id="btn-apply-crop" class="btn primary">✓ Aplicar</button>
          <button id="btn-cancel-crop" class="btn">✕ Cancelar</button>
        </div>
      </div>
    </aside>

    <section class="viewport" id="viewport">
      <div id="drop-hint" class="drop-hint">Arrastra una imagen aquí, pégala (Ctrl+V) o haz clic para abrirla</div>
      <div id="stage" class="stage hidden">
        <canvas id="main-canvas"></canvas>
        <canvas id="overlay-canvas"></canvas>
      </div>
    </section>
  </main>

  <footer class="status">
    <span id="img-info">Sin imagen</span>
    <span id="zoom-info"></span>
  </footer>
</div>

<!-- Resultados del OCR: texto y tabla -->
<dialog id="ocr-dialog">
  <div class="dlg-head">
    <div class="tabs">
      <button id="tab-text" class="tab active">Texto</button>
      <button id="tab-table" class="tab">Tabla</button>
    </div>
    <button id="ocr-close" class="btn">✕</button>
  </div>

  <div id="pane-text" class="pane">
    <textarea id="ocr-text" spellcheck="false"></textarea>
    <div class="group">
      <button id="btn-copy-text" class="btn">Copiar</button>
      <button id="btn-dl-text" class="btn primary">Descargar .txt</button>
    </div>
  </div>

  <div id="pane-table" class="pane hidden">
    <label class="inline">Sensibilidad de columnas
      <input type="range" id="gap-range" min="0.3" max="3" step="0.1" value="0.8">
      <span id="gap-val">0.8</span>
    </label>
    <p class="muted">Haz clic en una celda para corregirla. Si cambias la sensibilidad, la tabla se rehace.</p>
    <div class="table-wrap"><table id="ocr-table"></table></div>
    <div class="group">
      <button id="btn-copy-table" class="btn">Copiar</button>
      <button id="btn-dl-csv" class="btn">CSV</button>
      <button id="btn-dl-xlsx" class="btn primary">Excel (.xlsx)</button>
    </div>
  </div>
</dialog>

<!-- Reemplazar texto en la imagen -->
<dialog id="replace-dialog">
  <form id="replace-form">
    <h3>Reemplazar texto</h3>
    <label>Original <input id="rp-original" disabled></label>
    <label>Nuevo texto <input id="rp-text" autocomplete="off"></label>
    <div class="row2">
      <label>Tamaño (px) <input type="number" id="rp-size" min="4" max="500"></label>
      <label>Fuente
        <select id="rp-font">
          <option value="Arial, Helvetica, sans-serif">Arial</option>
          <option value="Verdana, sans-serif">Verdana</option>
          <option value="Georgia, serif">Georgia</option>
          <option value="'Times New Roman', serif">Times New Roman</option>
          <option value="'Courier New', monospace">Courier New</option>
        </select>
      </label>
    </div>
    <div class="row2">
      <label>Color del texto <input type="color" id="rp-fg"></label>
      <label>Color de fondo <input type="color" id="rp-bg"></label>
    </div>
    <label class="inline"><input type="checkbox" id="rp-bold"> Negrita</label>
    <div class="group end">
      <button type="button" id="rp-cancel" class="btn">Cancelar</button>
      <button type="button" id="rp-delete" class="btn">Borrar texto</button>
      <button type="submit" class="btn primary">Aplicar</button>
    </div>
  </form>
</dialog>

<input type="file" id="file-input" accept="image/*" hidden>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="ocr-utils.js"></script>
<script src="app.js"></script>
</body>
</html>
